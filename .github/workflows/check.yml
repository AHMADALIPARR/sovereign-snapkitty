name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -q dotpromptz protobuf grpcio-tools cryptography

      - name: Install zx
        run: npm install --no-save zx

      - name: Build LevelDB (for the air-gapped key store tests)
        run: |
          git clone --depth 1 https://github.com/google/leveldb.git /tmp/leveldb
          cmake -S /tmp/leveldb -B /tmp/leveldb-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DLEVELDB_BUILD_TESTS=OFF -DLEVELDB_BUILD_BENCHMARKS=OFF
          cmake --build /tmp/leveldb-build -j2
          echo "LEVELDB_LIB=/tmp/leveldb-build/libleveldb.so" >> "$GITHUB_ENV"

      - name: Compile the Protobuf schema
        run: .venv/bin/python -m grpc_tools.protoc -Iproto --python_out=src/dspy_dotprompt proto/harness.proto

      - name: Run the test suite
        run: .venv/bin/python tests/run_tests.py

      - name: Run the example harness
        run: .venv/bin/python examples/run_qa.py
